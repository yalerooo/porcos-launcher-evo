<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Porcos Launcher</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
      
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      html, body {
        width: 100%;
        height: 100%;
        background-color: transparent;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      
      .splash-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        padding: 40px;
        background: linear-gradient(145deg, rgba(24, 24, 27, 0.95) 0%, rgba(9, 9, 11, 0.98) 100%);
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 
          0 0 0 1px rgba(255, 255, 255, 0.05),
          0 25px 50px -12px rgba(0, 0, 0, 0.6),
          0 0 80px -20px rgba(255, 191, 186, 0.1);
        position: relative;
        overflow: hidden;
        min-width: 320px;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }
      
      .splash-container::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255, 191, 186, 0.4), transparent);
      }
      
      .splash-container.expanded {
        gap: 20px;
        padding: 32px;
      }
      
      .logo-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      .logo-glow {
        position: absolute;
        width: 180px;
        height: 180px;
        background: radial-gradient(circle, rgba(255, 191, 186, 0.15) 0%, transparent 70%);
        border-radius: 50%;
        animation: pulse 3s ease-in-out infinite;
      }
      
      .splash-logo {
        width: 120px;
        height: 120px;
        object-fit: contain;
        border-radius: 20px;
        animation: scaleIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        display: block;
        position: relative;
        z-index: 1;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        transition: all 0.3s ease;
      }
      
      .splash-container.expanded .splash-logo {
        width: 80px;
        height: 80px;
        border-radius: 16px;
      }
      
      .splash-container.expanded .logo-glow {
        width: 120px;
        height: 120px;
      }
      
      .splash-text {
        text-align: center;
        animation: fadeIn 0.5s ease-out 0.3s both;
      }
      
      .splash-title {
        font-size: 1.5rem;
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 4px;
        letter-spacing: -0.02em;
      }
      
      .splash-subtitle {
        font-size: 0.85rem;
        color: #71717a;
        font-weight: 400;
      }
      
      .splash-container.expanded .splash-text {
        display: none;
      }
      
      .loader-section {
        width: 100%;
        animation: fadeIn 0.5s ease-out 0.5s both;
      }
      
      .status-text {
        font-size: 0.75rem;
        color: #a1a1aa;
        text-align: center;
        margin-bottom: 12px;
        height: 18px;
        transition: opacity 0.3s ease;
      }
      
      .splash-loader {
        width: 100%;
        height: 4px;
        background: rgba(39, 39, 42, 0.8);
        border-radius: 2px;
        overflow: hidden;
        position: relative;
      }
      
      .loader-bar {
        width: 30%;
        height: 100%;
        background: linear-gradient(90deg, #ffbfba, #ffdcd9);
        border-radius: 2px;
        animation: loading 1.8s ease-in-out infinite;
        box-shadow: 0 0 12px rgba(255, 191, 186, 0.4);
      }
      
      .loader-bar.progress {
        animation: none;
        transition: width 0.3s ease;
      }
      
      /* Update Section */
      .update-section {
        display: none;
        width: 100%;
        animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }
      
      .update-section.visible {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      
      .update-header {
        text-align: center;
      }
      
      .update-title {
        font-size: 1.1rem;
        font-weight: 600;
        color: #ffffff;
        margin-bottom: 4px;
      }
      
      .update-subtitle {
        font-size: 0.8rem;
        color: #71717a;
      }
      
      .version-badge {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: rgba(39, 39, 42, 0.5);
        padding: 12px 16px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      
      .version-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
      }
      
      .version-label {
        font-size: 0.65rem;
        color: #71717a;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 500;
      }
      
      .version-number {
        font-size: 0.95rem;
        font-weight: 600;
        color: #d4d4d8;
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
      }
      
      .version-number.new {
        color: #ffbfba;
      }
      
      .version-arrow {
        color: #52525b;
        font-size: 1rem;
      }
      
      .update-notes {
        font-size: 0.75rem;
        color: #a1a1aa;
        background: rgba(39, 39, 42, 0.3);
        padding: 10px 12px;
        border-radius: 8px;
        max-height: 60px;
        overflow-y: auto;
        line-height: 1.5;
        border: 1px solid rgba(255, 255, 255, 0.03);
      }
      
      .update-notes::-webkit-scrollbar {
        width: 4px;
      }
      
      .update-notes::-webkit-scrollbar-thumb {
        background: #3f3f46;
        border-radius: 2px;
      }
      
      .update-actions {
        display: flex;
        gap: 10px;
      }
      
      .btn {
        flex: 1;
        height: 40px;
        border-radius: 10px;
        font-size: 0.85rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      
      .btn-secondary {
        background: transparent;
        color: #a1a1aa;
        border: 1px solid #27272a;
      }
      
      .btn-secondary:hover {
        border-color: #52525b;
        color: #ffffff;
        background: rgba(255, 255, 255, 0.02);
      }
      
      .btn-primary {
        background: #ffbfba;
        color: #18181b;
        font-weight: 600;
      }
      
      .btn-primary:hover {
        background: #ffdcd9;
        transform: translateY(-1px);
        box-shadow: 0 4px 16px rgba(255, 191, 186, 0.25);
      }
      
      .btn-primary:disabled {
        opacity: 0.7;
        cursor: not-allowed;
        transform: none;
      }
      
      /* Download Progress */
      .download-section {
        display: none;
        width: 100%;
        animation: fadeIn 0.3s ease;
      }
      
      .download-section.visible {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      
      .download-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      
      .download-text {
        font-size: 0.8rem;
        color: #d4d4d8;
      }
      
      .download-percent {
        font-size: 0.85rem;
        font-weight: 600;
        color: #ffbfba;
        font-family: 'JetBrains Mono', monospace;
      }
      
      .download-bar {
        width: 100%;
        height: 6px;
        background: rgba(39, 39, 42, 0.8);
        border-radius: 3px;
        overflow: hidden;
      }
      
      .download-progress {
        height: 100%;
        background: linear-gradient(90deg, #ffbfba, #ffdcd9);
        border-radius: 3px;
        transition: width 0.3s ease;
        box-shadow: 0 0 12px rgba(255, 191, 186, 0.3);
      }
      
      .download-info {
        font-size: 0.7rem;
        color: #71717a;
        text-align: center;
      }
      
      @keyframes scaleIn {
        from {
          transform: scale(0.7);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
      
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      @keyframes pulse {
        0%, 100% {
          opacity: 0.5;
          transform: scale(1);
        }
        50% {
          opacity: 0.8;
          transform: scale(1.05);
        }
      }
      
      @keyframes loading {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(400%);
        }
      }
    </style>
</head>
<body>
    <div class="splash-container" id="splashContainer">
        <div class="logo-wrapper">
            <div class="logo-glow"></div>
            <img src="/logo.jpg" alt="Porcos Launcher" class="splash-logo" />
        </div>
        
        <div class="splash-text">
            <h1 class="splash-title">Porcos Launcher</h1>
            <p class="splash-subtitle">Preparando tu experiencia...</p>
        </div>
        
        <div class="loader-section" id="loaderSection">
            <p class="status-text" id="statusText">Iniciando...</p>
            <div class="splash-loader">
                <div class="loader-bar" id="loaderBar"></div>
            </div>
        </div>
        
        <!-- Update Section (Hidden by default) -->
        <div class="update-section" id="updateSection">
            <div class="update-header">
                <h2 class="update-title" id="updateTitle">¡Nueva versión disponible!</h2>
                <p class="update-subtitle" id="updateSubtitle">Una actualización está lista para instalar</p>
            </div>
            
            <div class="version-badge">
                <div class="version-item">
                    <span class="version-label" id="currentLabel">Actual</span>
                    <span class="version-number" id="currentVersion">0.0.0</span>
                </div>
                <span class="version-arrow">→</span>
                <div class="version-item">
                    <span class="version-label new" id="newLabel">Nueva</span>
                    <span class="version-number new" id="newVersion">0.0.0</span>
                </div>
            </div>
            
            <div class="update-notes" id="updateNotes" style="display: none;"></div>
            
            <div class="update-actions">
                <button class="btn btn-secondary" id="skipBtn">Omitir</button>
                <button class="btn btn-primary" id="updateBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    <span id="updateBtnText">Actualizar</span>
                </button>
            </div>
        </div>
        
        <!-- Download Progress Section -->
        <div class="download-section" id="downloadSection">
            <div class="download-header">
                <span class="download-text" id="downloadText">Descargando actualización...</span>
                <span class="download-percent" id="downloadPercent">0%</span>
            </div>
            <div class="download-bar">
                <div class="download-progress" id="downloadProgress" style="width: 0%;"></div>
            </div>
            <p class="download-info" id="downloadInfo">Se reiniciará automáticamente al completar</p>
        </div>
    </div>
    <script type="module" src="/src/splashscreen.ts"></script>
</body>
</html>
